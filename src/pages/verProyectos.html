<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Proyectos - Gestor de Proyectos TechMahindra</title>
    <link rel="stylesheet" href="verProyectos.css">
    <script src="sessionCheck.js"></script>
    <script src="header&footer.js"></script>
    <script src="pokeMon.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="projects-section">
            <h2>Peleas Pokemon</h2>
            <form id="battleForm" class="battle-controls" aria-label="Simulador de batalla Pokemon">
                <input id="battlePokemonA" type="text" placeholder="Pokemon 1 (nombre o ID)" autocomplete="off" required>
                <input id="battlePokemonB" type="text" placeholder="Pokemon 2 (nombre o ID)" autocomplete="off" required>
                <button id="startBattle" type="submit">Iniciar batalla</button>
            </form>

            <section id="battleArena" class="battle-arena" aria-live="polite" hidden>
                <div class="battle-side" id="fighterA">
                    <h3 class="fighter-name">Pokemon 1</h3>
                    <img class="fighter-image" src="" alt="">
                    <div class="hp-track">
                        <div class="hp-fill" id="hpFillA"></div>
                    </div>
                    <p class="hp-text" id="hpTextA">100%</p>
                </div>

                <div class="battle-side" id="fighterB">
                    <h3 class="fighter-name">Pokemon 2</h3>
                    <img class="fighter-image" src="" alt="">
                    <div class="hp-track">
                        <div class="hp-fill" id="hpFillB"></div>
                    </div>
                    <p class="hp-text" id="hpTextB">100%</p>
                </div>
            </section>

            <div id="battleLog" class="battle-log" aria-live="polite"></div>

            <h2>Pokedex</h2>
            <form id="controlsForm" class="pokedex-controls" aria-label="Filtros de Pokédex">
                <input id="NameID" type="text" placeholder="Buscar por nombre o ID" autocomplete="off">

                <select id="typeFilter" aria-label="Filtrar por tipo">
                    <option value="">Todos los tipos</option>
                </select>

                <button type="submit">Aplicar</button>
            </form>

            <div class="projects-container" id="results" aria-live="polite" aria-busy="false"></div>

            <div class="actions-row">
                <button id="loadMore" type="button">Cargar más</button>
            </div>
        </section>
    </main>

    <template id="pokemon-card-template">
        <article class="project-card">
            <div class="project-header">
                <h3 class="pokemon-name"></h3>
                <p class="pokemon-id"></p>
            </div>
            <div class="project-body">
                <img class="pokemon-image card-img" src="" alt="">
                <div class="project-meta pokemon-types types"></div>

                <div class="card-group">
                    <h4>Habilidades</h4>
                    <ul class="ability-list"></ul>
                </div>

                <div class="card-group">
                    <h4>Stats</h4>
                    <ul class="stats-list"></ul>
                </div>
            </div>
        </article>
    </template>

    <div id="battleWinnerOverlay" class="battle-winner-overlay" hidden>
        <div class="battle-winner-card">
            <p class="winner-title">Ganador</p>
            <img id="winnerImage" src="" alt="">
            <h3 id="winnerName"></h3>
            <button id="closeWinnerOverlay" type="button">Cerrar</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>
</body>
</html>
